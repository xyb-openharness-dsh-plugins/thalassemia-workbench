<meta name="robots" content="noindex">
<!-- 内联 favicon：file:// 或单目录托管时不给 favicon 会在控制台留一条 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f57'/%3E%3Ctext x='16' y='23' font-size='18' font-family='PingFang SC,Helvetica,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3E%E9%93%81%3C/text%3E%3C/svg%3E">

<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="proto-bar"><span><b>小铁宝 v0.4.3</b> · 本机资料</span><span id="data-source">正在读取本机数据…</span></div>

<div class="app" id="app">
  <!-- 三段式顶栏：左 品牌+档案 / 中 页签 / 右 AI+设置 -->
  <header class="topbar">
    <div class="tb-left">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">铁</span>
        <span class="brand-text"><strong>小铁宝</strong><em>FerroPal</em></span>
      </div>
      <button class="profile-btn" id="profile-btn" aria-label="切换演示档案" aria-haspopup="dialog">
        <span class="avatar" id="profile-avatar" aria-hidden="true">宇</span>
        <span class="profile-text"><b id="profile-name">小宇</b><em id="profile-meta">6 岁 · 输血依赖</em></span>
        <span aria-hidden="true">⌄</span>
      </button>
    </div>
    <nav class="tb-mid" id="nav" aria-label="一级导航"></nav>
    <div class="tb-right">
      <button class="chip" data-act="settings" aria-label="打开设置">设置</button>
      <button class="chip" id="font-toggle" aria-pressed="false" title="切换大字">大字 Aa</button>
      <button class="chip primer-trigger" data-primer-open aria-label="疾病概要：定义、医学资料与指南情况、治疗全景、发展趋势" title="疾病概要：定义 · 指南 · 治疗全景 · 趋势">?</button>
      <button class="chip ver" data-act="about" id="ver-chip">v0.4.3</button>
    </div>
  </header>

  <div class="body" id="body">
    <main id="main" tabindex="-1"></main>
  </div>

  <footer class="footer">
    <span>小铁宝 · 和地贫家庭一起，把输血、排铁与复查记成可以带走的材料</span>
    <span class="ver-line"><b id="app-version">v0.4.3</b><em id="app-build">2026-10-25</em></span>
  </footer>
</div>

<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head">
    <div><span class="eyebrow" id="dialog-eyebrow">小铁宝</span><h2 id="dialog-title"></h2></div>
    <button class="icon-btn" data-act="close" aria-label="关闭">×</button>
  </div>
  <div id="dialog-body" class="dialog-body"></div>
  <div id="dialog-foot" class="dialog-foot"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="bootstrap.js"></script>
<script src="primer-data.js"></script>
<script src="primer.js"></script>
</body>
</html>
